<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The 305</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app" class="hidden">
        <div class="stage">
            <svg class="palm palm-left" viewBox="0 0 120 180" aria-hidden="true">
                <path d="M62 176 L62 92 M62 98 C18 86 8 52 22 22 M62 94 C36 70 40 28 58 12 M62 92 C70 58 96 28 116 24 M62 96 C86 78 98 46 92 18 M62 100 C48 78 20 70 8 86" />
            </svg>
            <svg class="palm palm-right" viewBox="0 0 120 180" aria-hidden="true">
                <path d="M58 176 L58 92 M58 98 C102 86 112 52 98 22 M58 94 C84 70 80 28 62 12 M58 92 C50 58 24 28 4 24 M58 96 C34 78 22 46 28 18 M58 100 C72 78 100 70 112 86" />
            </svg>
            <div class="tablet-wrap">
            <div class="tablet">
                <span class="camera"></span>
                <section class="screen">
                    <div class="watermark" aria-hidden="true">
                        <img src="images/watermark.png" alt="" />
                    </div>
                    <header class="topbar">
                        <div class="brand">
                            <img class="brand-logo" src="images/logo.png" alt="The 305" />
                            <div class="brand-copy">
                                <p class="brand-kicker">305 Miami</p>
                                <h1 id="shop-title">Black Market</h1>
                                <p id="shop-location">Miami</p>
                            </div>
                        </div>
                        <nav id="categories" class="tabs"></nav>
                        <div class="profile">
                            <div class="profile-text">
                                <strong id="player-name">Customer</strong>
                                <span id="player-role">Connected</span>
                            </div>
                            <div id="player-avatar" class="avatar">C</div>
                        </div>
                    </header>

                    <div class="stats">
                        <article class="stat">
                            <strong id="money-cash">$0</strong>
                            <span>Wallet</span>
                        </article>
                        <article class="stat">
                            <strong id="money-black">$0</strong>
                            <span>Dirty Cash</span>
                        </article>
                        <article class="stat">
                            <strong id="cart-total">$0</strong>
                            <span id="cart-count">0 items</span>
                        </article>
                    </div>

                    <div class="workspace">
                        <section class="catalog">
                            <div class="catalog-head">
                                <div>
                                    <h2>Catalog</h2>
                                    <p id="catalog-count">0 items available</p>
                                </div>
                                <div class="catalog-tools">
                                    <label class="search">
                                        <svg viewBox="0 0 24 24" aria-hidden="true">
                                            <circle cx="11" cy="11" r="7" />
                                            <path d="M20 20l-3.2-3.2" />
                                        </svg>
                                        <input id="search" type="text" placeholder="Search the 305" autocomplete="off" spellcheck="false" />
                                    </label>
                                    <div class="pay-toggle" role="tablist">
                                        <button type="button" id="pay-black" class="active" data-method="black_money">Dirty Cash</button>
                                        <button type="button" id="pay-cash" data-method="cash">Cash</button>
                                    </div>
                                </div>
                            </div>
                            <div id="grid" class="grid"></div>
                        </section>

                        <aside class="cart">
                            <div class="cart-head">
                                <h2>Cart</h2>
                                <p>Review and close the deal</p>
                            </div>
                            <div id="cart-list" class="cart-list">
                                <p class="empty">Your cart is empty.</p>
                            </div>
                            <div class="cart-foot">
                                <div class="row">
                                    <span>Method</span>
                                    <strong id="method-label">Dirty Cash</strong>
                                </div>
                                <div class="row">
                                    <span>Total</span>
                                    <strong id="method-total">$0</strong>
                                </div>
                                <button type="button" id="btn-checkout" class="checkout" disabled>Close Deal</button>
                            </div>
                        </aside>
                    </div>
                </section>
                <span class="home-bar"></span>
            </div>
            <button type="button" id="btn-close" class="esc">ESC · Leave the 305</button>
            </div>
        </div>
        <div id="toast" class="toast hidden"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
